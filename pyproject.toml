[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vincibot"
version = "0.2.0"
description = "VinciBot (MatataStudio) per Bluetooth mit Python steuern – einfach und auf Deutsch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["bleak>=0.22"]

[project.scripts]
vincibot-konverter = "vincibot.scratch:haupt"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["vincibot"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
include = ["vincibot", "beispiele", "tests", "werkzeuge"]
pythonVersion = "3.10"
ignore = ["werkzeuge"]
